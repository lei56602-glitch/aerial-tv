name: LocalSend Android core

on:
  workflow_dispatch:
  push:
    branches:
      - feature/localsend-integration
    paths:
      - ".gitmodules"
      - "docs/LOCALSEND_INTEGRATION.md"
      - "native/localsend/**"
      - "app/src/main/java/app/orchard/tv/localsend/**"
      - ".github/workflows/localsend-android-core.yml"
  pull_request:
    paths:
      - ".gitmodules"
      - "docs/LOCALSEND_INTEGRATION.md"
      - "native/localsend/**"
      - "app/src/main/java/app/orchard/tv/localsend/**"
      - ".github/workflows/localsend-android-core.yml"

permissions:
  contents: read

jobs:
  build-rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Aerial and pinned LocalSend source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure Android SDK command line tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install pinned NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;27.2.12479018"

      - name: Set up Rust and Android target
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build LocalSend JNI bridge and full protocol core for Android API 21
        run: cargo ndk -t arm64-v8a --platform 21 build --release --manifest-path native/localsend/Cargo.toml

      - name: Upload native bridge smoke-test library
        uses: actions/upload-artifact@v4
        with:
          name: aerial-localsend-arm64-api21
          path: native/localsend/target/aarch64-linux-android/release/libaerial_localsend.so
          if-no-files-found: error
          retention-days: 14
